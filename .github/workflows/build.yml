name: Auto-Create & Build AnupamaShield APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Complete Android Project
        run: |
          mkdir -p app/src/main/java/com/shield/anupamablocker
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AnupamaShield"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.shield.anupamablocker'
              compileSdk 34
              defaultConfig {
                  applicationId "com.shield.anupamablocker"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Anupamaa Shield"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".AnupamaBlockerService"
                      android:exported="true"
                      android:label="Anupamaa Facebook Blocker"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowContentChanged|typeViewScrolled"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_service_description"
              android:notificationTimeout="150"
              android:packageNames="com.facebook.katana,com.facebook.lite" />
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Anupamaa Shield</string>
              <string name="accessibility_service_description">Automatically scrolls past Anupamaa posts and reels on Facebook.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/java/com/shield/anupamablocker/MainActivity.kt
          package com.shield.anupamablocker
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("AnupamaPrefs", Context.MODE_PRIVATE)
                  val defaultKeywords = "anupama,anupamaa,अनुपमा,rupali ganguly,रूपाली गांगुली,anuj kapadia,vanraj shah,gaurav khanna,#anupamaa,#maan,shah house"
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 64, 48, 48)
                      setBackgroundColor(Color.parseColor("#0F172A"))
                  }
                  val title = TextView(this).apply {
                      text = "Anupamaa Shield"
                      textSize = 26f
                      setTextColor(Color.WHITE)
                      setPadding(0, 0, 0, 16)
                  }
                  val subtitle = TextView(this).apply {
                      text = "Native Facebook Content & Reel Blocker"
                      textSize = 14f
                      setTextColor(Color.parseColor("#94A3B8"))
                      setPadding(0, 0, 0, 48)
                  }
                  val keywordLabel = TextView(this).apply {
                      text = "Blocked Keywords (comma-separated):"
                      textSize = 14f
                      setTextColor(Color.WHITE)
                      setPadding(0, 0, 0, 12)
                  }
                  val keywordInput = EditText(this).apply {
                      setText(prefs.getString("keywords", defaultKeywords))
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#1E293B"))
                      setPadding(24, 24, 24, 24)
                  }
                  val saveBtn = Button(this).apply {
                      text = "Save Keywords"
                      setBackgroundColor(Color.parseColor("#2563EB"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          prefs.edit().putString("keywords", keywordInput.text.toString()).apply()
                          Toast.makeText(this@MainActivity, "Keywords updated!", Toast.LENGTH_SHORT).show()
                      }
                  }
                  val spacer = Space(this).apply { minimumHeight = 40 }
                  val enableServiceBtn = Button(this).apply {
                      text = "1. Enable Accessibility Shield"
                      setBackgroundColor(Color.parseColor("#10B981"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  layout.addView(title)
                  layout.addView(subtitle)
                  layout.addView(keywordLabel)
                  layout.addView(keywordInput)
                  layout.addView(saveBtn)
                  layout.addView(spacer)
                  layout.addView(enableServiceBtn)
                  setContentView(layout)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/shield/anupamablocker/AnupamaBlockerService.kt
          package com.shield.anupamablocker
          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Context
          import android.graphics.Path
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class AnupamaBlockerService : AccessibilityService() {
              private var lastScrollTime = 0L
              private fun getKeywords(): List<String> {
                  val prefs = getSharedPreferences("AnupamaPrefs", Context.MODE_PRIVATE)
                  val raw = prefs.getString("keywords", "anupama,anupamaa,अनुपमा,rupali ganguly,रूपाली गांगुली,anuj kapadia,vanraj shah,gaurav khanna,#anupamaa,#maan,shah house") ?: ""
                  return raw.split(",").map { it.trim().lowercase() }.filter { it.isNotEmpty() }
              }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  val rootNode = rootInActiveWindow ?: return
                  val now = System.currentTimeMillis()
                  if (now - lastScrollTime < 800) return
                  val keywords = getKeywords()
                  if (scanNodeForAnupama(rootNode, keywords)) {
                      lastScrollTime = now
                      performFastSwipeUp()
                  }
              }
              private fun scanNodeForAnupama(node: AccessibilityNodeInfo?, keywords: List<String>): Boolean {
                  if (node == null) return false
                  val text = node.text?.toString()?.lowercase() ?: ""
                  val desc = node.contentDescription?.toString()?.lowercase() ?: ""
                  for (kw in keywords) {
                      if (text.contains(kw) || desc.contains(kw)) return true
                  }
                  for (i in 0 until node.childCount) {
                      if (scanNodeForAnupama(node.getChild(i), keywords)) return true
                  }
                  return false
              }
              private fun performFastSwipeUp() {
                  val displayMetrics = resources.displayMetrics
                  val midX = displayMetrics.widthPixels / 2f
                  val startY = displayMetrics.heightPixels * 0.80f
                  val endY = displayMetrics.heightPixels * 0.15f
                  val swipePath = Path().apply {
                      moveTo(midX, startY)
                      lineTo(midX, endY)
                  }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(swipePath, 0, 180))
                      .build()
                  dispatchGesture(gesture, null, null)
              }
              override fun onInterrupt() {}
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: AnupamaShield-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
